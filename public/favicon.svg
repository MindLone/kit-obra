<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Arredondado Laranja Oficial Obra Sem Mistério -->
  <rect width="64" height="64" rx="16" fill="url(#orangeGrad)" />

  <!-- Capacete de Obra (Ícone nítido para favicon de 16x16 até 512x512) -->
  <!-- Cúpula do Capacete -->
  <path
    d="M 16 35 C 16 21, 23 15, 32 15 C 41 15, 48 21, 48 35 Z"
    fill="#ffffff"
    filter="url(#shadow)"
  />

  <!-- Nervura Central de Reforço do Capacete -->
  <path
    d="M 30.5 15 C 30.5 15, 30.5 35, 30.5 35 L 33.5 35 C 33.5 35, 33.5 15, 33.5 15 Z"
    fill="#f1f5f9"
    opacity="0.85"
  />

  <!-- Aba Protetora Inferior -->
  <path
    d="M 12 35 C 12 33.5, 52 33.5, 52 35 C 52 38, 48 39.5, 32 39.5 C 16 39.5, 12 38, 12 35 Z"
    fill="#ffffff"
  />

  <!-- Faixa de Contorno e Sombra da Aba -->
  <path
    d="M 14 36.5 C 22 38.5, 42 38.5, 50 36.5 C 49 39, 42 41, 32 41 C 22 41, 15 39, 14 36.5 Z"
    fill="#e2e8f0"
  />
</svg>
